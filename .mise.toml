[tools]
node = "lts"
python = "3.14"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the test dependencies into .venv"
run = "uv pip install -r requirements_test.txt"

[tasks.lint]
description = "Run ruff and mypy"
run = ["ruff check .", "ruff format --check .", "mypy"]

[tasks.fmt]
description = "Format with ruff"
run = "ruff format ."

[tasks.test]
description = "Run the test suite"
run = "pytest -q"

[tasks.test-js]
description = "Run the editor page tests"
run = "node --test \"tests/js/*.test.mjs\""

[tasks.rig]
description = "Drive the throwaway Home Assistant rig (Podman): up, onboard, confirm, seed, shot, logs, down"
run = "python tools/rig/rig.py"

[tasks.double]
description = "Run a device double: tender or wall"
run = "python tools/rig/double.py"

[tasks.soak]
description = "Run the soak: mise run soak -- --minutes 20"
run = "python tools/soak/soak.py"

[tasks.measure]
description = "Measure the latency budgets and write docs/measurements.md"
run = "python tools/soak/measure.py --write-docs"

[tasks.check]
description = "Lint, then test"
depends = ["lint", "test", "test-js"]
