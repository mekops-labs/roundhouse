name: CI

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            ha: ""
          - channel: previous
            ha: "==2026.9.*"
          - channel: beta
            ha: "==2026.11.0b1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup
      # The plugin pins one HA release, so the previous release resolves
      # its own plugin version together with HA.
      - if: matrix.channel == 'previous'
        run: uv pip install "homeassistant${{ matrix.ha }}" "pytest-homeassistant-custom-component==0.13.367"
      # No plugin release supports the beta yet, so the beta job runs a smoke
      # test: every module imports and the contract vectors pass. The respx
      # plugin is off because it imports httpx before Home Assistant can.
      - if: matrix.channel == 'beta'
        run: |
          uv pip install --pre "homeassistant${{ matrix.ha }}"
          .venv/bin/python -c "import custom_components.roundhouse.config_flow, custom_components.roundhouse.device"
          .venv/bin/pytest -q -p no:homeassistant -p no:respx --noconftest tests/test_contract_vectors.py
      - if: matrix.channel != 'beta'
        run: mise run test
